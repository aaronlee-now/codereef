<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Aquarium — CodeReef</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=shop3" />
    <link rel="stylesheet" href="shop.css?v=fins1" />
  </head>
  <body class="page page--auth">
    <a class="back-link" href="home.html?v=swim1">← Back home</a>

    <main class="aquarium-page">
      <header class="auth__header">
        <p class="auth__brand">CodeReef</p>
        <h1 class="auth__title">My Aquarium</h1>
        <p class="auth__hint">Watch the fish you bought swim around!</p>
      </header>

      <div class="shop-coin-bar" aria-live="polite">
        <span class="shop-coin-bar__icon" aria-hidden="true"></span>
        <span id="aquarium-coins">0 Sand, 0 Coral, 0 Pearl, 0 Treasure</span>
      </div>
      <p class="aquarium-count" id="aquarium-count"></p>

      <div class="aquarium-actions">
        <button type="button" class="aquarium-race-btn" id="fish-race-btn">Fish race</button>
        <button type="button" class="aquarium-race-btn" id="race-again-btn" hidden>Race again</button>
        <button type="button" class="aquarium-race-btn aquarium-race-btn--calm" id="swim-again-btn" hidden>
          Back to swimming
        </button>
      </div>
      <p class="aquarium-race-msg" id="aquarium-race-msg" role="status"></p>

      <section class="aquarium-picker" id="aquarium-picker" hidden>
        <h2 class="aquarium-picker__title">Pick 8 fish</h2>
        <p class="aquarium-picker__count" id="aquarium-picker-count">0 of 8 picked</p>
        <div class="aquarium-picker__grid" id="aquarium-picker-grid"></div>
        <div class="aquarium-picker__actions">
          <button type="button" class="aquarium-race-btn" id="picker-start-btn" disabled>Start race</button>
          <button type="button" class="aquarium-race-btn aquarium-race-btn--calm" id="picker-back-btn">
            Back to swimming
          </button>
        </div>
      </section>

      <div class="aquarium-tank" id="aquarium-tank" aria-label="Your aquarium">
        <div class="aquarium-tank__sand" aria-hidden="true"></div>
      </div>

      <nav class="shop-links">
        <a href="shop.html?v=swim1">Fish Shop</a>
        <a href="home.html?v=swim1">Home</a>
      </nav>
    </main>

    <script src="auth.js?v=shop3"></script>
    <script src="reef-wallet.js?v=fins1"></script>
    <script src="aquarium.js?v=flap2"></script>
  </body>
</html>
