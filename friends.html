<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="assets/codereef-front-cover.png" />
    <link rel="apple-touch-icon" href="assets/codereef-front-cover.png" />
    <title>Race friends — CodeReef</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=eye1" />
    <link rel="stylesheet" href="shop.css?v=eye1" />
    <link rel="stylesheet" href="friends.css?v=eye1" />
  </head>
  <body class="page page--auth">
    <a class="back-link" href="home.html?v=swim1">← Back home</a>

    <main class="shop-page">
      <header class="auth__header">
        <p class="auth__brand">CodeReef</p>
        <h1 class="auth__title">Race friends</h1>
        <p class="auth__hint">Ask a friend by name. They have to say yes before you can chat or race.</p>
      </header>

      <form class="friend-ask" id="friend-ask">
        <label class="field">
          <span class="field__label">Friend's name</span>
          <input class="field__input" name="friend_name" type="text" placeholder="Sam" autocomplete="off" />
        </label>
        <button class="auth__submit" type="submit">Ask to be friends</button>
        <p class="shop-msg" id="friend-ask-msg" role="status"></p>
      </form>

      <section aria-label="Friend requests">
        <h2 class="friend-heading">Waiting for you</h2>
        <div id="friend-incoming"></div>
        <h2 class="friend-heading">You asked</h2>
        <div id="friend-outgoing"></div>
      </section>

      <section aria-label="Your friends">
        <h2 class="friend-heading">Friends</h2>
        <div id="friend-list"></div>
      </section>

      <section class="friend-chat" id="friend-chat" hidden>
        <h2 class="friend-heading" id="friend-chat-name">Chat</h2>
        <div class="friend-chat__log" id="friend-chat-log" aria-live="polite"></div>
        <form class="friend-chat__form" id="friend-chat-form">
          <input class="field__input" name="text" type="text" maxlength="80" placeholder="Say hi" autocomplete="off" />
          <button class="auth__submit" type="submit">Send</button>
        </form>
      </section>

      <section class="friend-race" id="friend-race" hidden aria-live="polite"></section>

      <nav class="shop-links" aria-label="Reef places">
        <a href="explore.html?v=swim1">Start exploring</a>
        <a href="aquarium.html?v=swim1">My aquarium</a>
        <a href="shop.html?v=swim1">Fish shop</a>
        <a href="sell.html?v=sell1">Sell items</a>
        <a href="friends.html?v=eye1" aria-current="page">Race friends</a>
        <a class="shop-links__settings" href="settings.html?v=settings1">Settings</a>
      </nav>
    </main>

    <script src="auth.js?v=eye1"></script>
    <script src="cloud.js?v=eye4"></script>
    <script src="reef-wallet.js?v=eye1"></script>
    <script src="friends.js?v=eye1"></script>
  </body>
</html>
