<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="assets/codereef-front-cover.png" />
    <link rel="apple-touch-icon" href="assets/codereef-front-cover.png" />
    <title>Log in — CodeReef</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=link1" />
  </head>
  <body class="page page--auth">
    <a class="back-link" href="index.html">← Back to cover</a>

    <main class="auth">
      <header class="auth__header">
        <p class="auth__brand">CodeReef</p>
        <h1 class="auth__title">Welcome back</h1>
        <p class="auth__hint">
          Log in with your name and password. We’ll email your parent when you
          dive in.
        </p>
      </header>

      <form class="auth__form" action="#" method="post">
        <p class="auth__message" hidden></p>

        <label class="field">
          <span class="field__label">Kid's first name</span>
          <input
            class="field__input"
            type="text"
            name="kid_name"
            autocomplete="nickname"
            required
            placeholder="Sam"
          />
        </label>

        <label class="field">
          <span class="field__label">Password</span>
          <input
            class="field__input"
            type="password"
            name="password"
            autocomplete="current-password"
            required
            minlength="6"
            placeholder="Your password"
          />
        </label>

        <button class="auth__submit" type="submit">Log in</button>
      </form>

      <p class="auth__switch">
        New here?
        <a href="signup.html">Sign up</a>
      </p>

      <p class="auth__switch">
        <button class="auth__text-btn" type="button" id="show-paste-code">
          I already have an account on another computer
        </button>
      </p>

      <div class="link-panel" id="paste-code-panel" hidden>
        <p class="auth__hint">The other computer gets a copy, and both can stay logged in.</p>
        <label class="field" for="paste-link-code">
          <span class="field__label">Paste the link code</span>
          <textarea
            class="field__input"
            id="paste-link-code"
            rows="4"
            autocomplete="off"
            spellcheck="false"
          ></textarea>
        </label>
        <button class="auth__submit" type="button" id="use-link-code">Log in</button>
        <p class="auth__message" id="paste-message" hidden></p>
      </div>
    </main>
    <script src="auth.js?v=link1"></script>
    <script src="login.js?v=link1"></script>
  </body>
</html>
