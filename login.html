<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="assets/codereef-front-cover.png" />
    <link rel="apple-touch-icon" href="assets/codereef-front-cover.png" />
    <title>Log in — CodeReef</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=code1" />
  </head>
  <body class="page page--auth">
    <a class="back-link" href="index.html">← Back to cover</a>

    <main class="auth">
      <header class="auth__header">
        <p class="auth__brand">CodeReef</p>
        <h1 class="auth__title">Welcome back</h1>
        <p class="auth__hint">
          Use your name, your password, and the same parent email from sign up.
          CodeReef will email a code. Type that code to finish signing in.
        </p>
      </header>

      <form class="auth__form" action="#" method="post">
        <p class="auth__message" hidden></p>

        <label class="field">
          <span class="field__label">Kid's first name</span>
          <input
            class="field__input"
            type="text"
            name="kid_name"
            autocomplete="nickname"
            required
            placeholder="Sam"
          />
        </label>

        <label class="field">
          <span class="field__label">Parent email</span>
          <input
            class="field__input"
            type="text"
            name="parent_email"
            inputmode="email"
            autocomplete="email"
            required
            placeholder="The email from sign up"
          />
        </label>

        <div class="field">
          <label class="field__label" for="login-password">Password</label>
          <div class="field__password">
            <input
              class="field__input"
              id="login-password"
              type="password"
              name="password"
              autocomplete="current-password"
              required
              minlength="6"
              placeholder="Your password"
            />
            <button class="field__eye" type="button" aria-label="Show password" aria-pressed="false">
              <svg class="field__eye-open" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
                <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"></path>
                <circle cx="12" cy="12" r="2.6" fill="currentColor"></circle>
              </svg>
              <svg class="field__eye-shut" hidden viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
                <path d="M3 4l18 16" fill="none" stroke="currentColor" stroke-width="2"></path>
                <path d="M2 12s4-6 10-6c2.2 0 4.1.6 5.7 1.6M22 12s-4 6-10 6c-2.2 0-4.1-.6-5.7-1.6" fill="none" stroke="currentColor" stroke-width="2"></path>
              </svg>
            </button>
          </div>
        </div>

        <button class="auth__submit" type="submit">Log in</button>
      </form>

      <p class="auth__switch">
        New here?
        <a href="signup.html">Sign up</a>
      </p>
    </main>
    <script src="auth.js?v=code1"></script>
    <script src="cloud.js?v=code1"></script>
    <script src="login.js?v=code1"></script>
  </body>
</html>
