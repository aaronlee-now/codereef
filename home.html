<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home — CodeReef</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=screen1" />
    <link rel="stylesheet" href="shop.css?v=swim1" />
  </head>
  <body>
    <main class="cover cover--home">
      <img
        class="cover__art cover__art--home"
        src="assets/codereef-front-cover.png"
        alt="CodeReef reef with a glowing laptop and sea friends"
      />
      <div class="cover__shade cover__shade--home"></div>

      <div class="home-banner">
        <p class="home-banner__label">You're in the reef</p>
        <h1 class="home-banner__name" id="home-name">Diver</h1>
      </div>

      <a
        class="cover__screen cover__screen--link"
        id="cover-screen"
        href="explore.html"
      >
        <span class="cover__screen-text" id="cover-screen-text">Start exploring</span>
      </a>

      <div class="cover__content">
        <a class="cover__btn cover__btn--explore" href="explore.html?v=swim1">Start exploring</a>
        <a class="cover__btn cover__btn--aquarium" href="aquarium.html?v=swim1">My Aquarium</a>
        <a class="cover__btn cover__btn--shop" href="shop.html?v=swim1">Fish Shop</a>
      </div>
    </main>
    <script src="auth.js?v=shop3"></script>
    <script src="progress.js?v=screen1"></script>
    <script src="reef-wallet.js?v=rare1"></script>
    <script src="home.js?v=screen1"></script>
    <script src="menu-fish.js?v=swim1"></script>
  </body>
</html>
