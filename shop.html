<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fish Shop — CodeReef</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=shop3" />
    <link rel="stylesheet" href="shop.css?v=ultra1" />
  </head>
  <body class="page page--auth">
    <a class="back-link" href="home.html?v=swim1">← Back home</a>

    <main class="shop-page">
      <header class="auth__header">
        <p class="auth__brand">CodeReef</p>
        <h1 class="auth__title">Fish Shop</h1>
        <p class="auth__hint">New fish just swam in! A few trails can buy a little fish. Rare fish need Pearl and Treasure. You can buy the same fish more than once!</p>
      </header>

      <a class="shop-resume" id="shop-resume" href="explore.html">Resume tasks</a>

      <div class="shop-coin-bar" aria-live="polite">
        <span class="shop-coin-bar__icon" aria-hidden="true"></span>
        <span id="shop-coins">0 Sand, 0 Coral, 0 Pearl, 0 Treasure</span>
      </div>

      <div class="shop-tabs" id="shop-tabs" role="tablist" aria-label="Shop categories">
        <button class="shop-tab is-on" type="button" role="tab" aria-selected="true" data-shop-tab="all">All</button>
        <button class="shop-tab" type="button" role="tab" aria-selected="false" data-shop-tab="fish">Fish</button>
        <button class="shop-tab" type="button" role="tab" aria-selected="false" data-shop-tab="decor">Decorations</button>
        <button class="shop-tab" type="button" role="tab" aria-selected="false" data-shop-tab="outfit">Outfits</button>
      </div>

      <div class="shop-grid" id="shop-grid" role="list"></div>
      <p class="shop-msg" id="shop-msg" role="status"></p>

      <nav class="shop-links" aria-label="Reef places">
        <a href="explore.html?v=swim1">Start exploring</a>
        <a href="aquarium.html?v=swim1">My aquarium</a>
        <a href="shop.html?v=swim1" aria-current="page">Fish shop</a>
        <a href="sell.html?v=sell1">Sell items</a>
        <a class="shop-links__settings" href="settings.html?v=settings1">Settings</a>
      </nav>
    </main>

    <div class="shop-replace" id="shop-replace" hidden>
      <div
        class="shop-replace__box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="shop-replace-title"
      >
        <h2 class="shop-replace__title" id="shop-replace-title">Aquarium is full</h2>
        <p class="shop-replace__text" id="shop-replace-text"></p>
        <div class="shop-replace__want" id="shop-replace-want"></div>
        <div class="shop-replace__list" id="shop-replace-list"></div>
        <p class="shop-replace__need" id="shop-replace-need"></p>
        <button class="shop-replace__skip" type="button" id="shop-replace-no">Don't buy</button>
      </div>
    </div>

    <div class="shop-sure" id="shop-sure" hidden>
      <div
        class="shop-sure__box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="shop-sure-text"
      >
        <p class="shop-sure__text" id="shop-sure-text"></p>
        <div class="shop-sure__actions">
          <button class="shop-sure__yes" type="button" id="shop-sure-yes">Yes, sell</button>
          <button class="shop-sure__no" type="button" id="shop-sure-no">No</button>
        </div>
      </div>
    </div>

    <script src="auth.js?v=shop3"></script>
    <script src="progress.js?v=save2"></script>
    <script src="reef-wallet.js?v=wearpage2"></script>
    <script src="shop.js?v=wearpage2"></script>
  </body>
</html>
