<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="assets/codereef-front-cover.png" />
    <link rel="apple-touch-icon" href="assets/codereef-front-cover.png" />
    <title>Enter your code — CodeReef</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=code1" />
  </head>
  <body class="page page--auth">
    <a class="back-link" href="login.html" id="verify-back">← Back to log in</a>

    <main class="auth">
      <header class="auth__header">
        <p class="auth__brand">CodeReef</p>
        <h1 class="auth__title">Enter your code</h1>
        <p class="auth__hint" id="verify-hint">
          CodeReef emailed a code to the parent email from sign up. Ask a parent
          to read it to you.
        </p>
      </header>

      <form class="auth__form" action="#" method="post">
        <p class="auth__message" hidden></p>

        <label class="field">
          <span class="field__label">Verification code</span>
          <input
            class="field__input field__input--code"
            type="text"
            name="code"
            inputmode="numeric"
            autocomplete="one-time-code"
            required
            maxlength="6"
            placeholder="000000"
          />
        </label>

        <button class="auth__submit" type="submit">Sign in</button>
      </form>

      <p class="auth__switch">
        No code yet?
        <button class="auth__text-btn" type="button" id="verify-resend">Send a new code</button>
      </p>
    </main>
    <script src="auth.js?v=code1"></script>
    <script src="cloud.js?v=repair1"></script>
    <script src="verify.js?v=code1"></script>
  </body>
</html>
